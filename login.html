<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کدلیب | ورود</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card glass fade-in">
            <h1 id="authTitle">کدلیب</h1>
            <p id="authSubtitle" class="subtitle">صندوقچه کد خصوصی شما</p>
            <form id="authForm">
                <div class="input-group">
                    <label for="username">نام کاربری</label>
                    <input type="text" id="username" placeholder="یک نام کاربری وارد کنید" required>
                </div>
                <div class="input-group">
                    <label for="password">رمز عبور</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; justify-content: center;">ورود</button>
            </form>
            <p id="toggleWrapper" style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-dim);">
                <span id="toggleText">تازه وارد هستید؟ </span>
                <a href="#" id="toggleAuth" style="color: var(--accent-primary); text-decoration: none;">ایجاد حساب کاربری</a>
            </p>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
