<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کدلیب | تنظیمات</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <header class="nav-bar">
            <div style="display: flex; align-items: center; gap: 1.5rem;">
                <a href="dashboard.html" style="color: var(--text-dim); text-decoration: none; font-size: 1.2rem;">
                    <i class="fas fa-arrow-right"></i>
                </a>
                <h1 style="margin-bottom: 0; font-size: 1.8rem;">تنظیمات</h1>
            </div>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <button id="themeToggle" class="btn btn-secondary btn-sm" title="تغییر تم" style="padding: 0.5rem;">
                    <i class="fas fa-moon"></i>
                </button>
                <button id="logoutBtn" class="btn btn-secondary btn-sm" title="خروج" style="padding: 0.5rem;">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </header>

        <main class="settings-wrapper">
            <!-- Sidebar Navigation -->
            <aside class="settings-sidebar glass">
                <ul class="settings-tabs">
                    <li class="tab-item active" data-tab="appearance-editor">
                        <i class="fas fa-sliders-h"></i>
                        <span>ظاهر و ویرایشگر</span>
                    </li>
                    <li class="tab-item" data-tab="account">
                        <i class="fas fa-user-cog"></i>
                        <span>حساب کاربری</span>
                    </li>
                </ul>
            </aside>

            <!-- Main Content Area -->
            <div class="settings-content">
                <!-- Tab 1: Appearance & Editor -->
                <div id="tab-appearance-editor" class="tab-content active">
                    <section class="glass settings-panel">
                        <div class="settings-panel-header">
                            <div>
                                <h2>ظاهر</h2>
                                <p>نحوه نمایش محیط برنامه را تنظیم کنید.</p>
                            </div>
                        </div>
                        <div class="settings-list">
                            <label class="setting-row">
                                <span>
                                    <strong>تم روشن</strong>
                                    <small>نمایش رابط با پس زمینه روشن</small>
                                </span>
                                <input type="checkbox" id="lightThemeSetting">
                            </label>
                            <label class="setting-row">
                                <span>
                                    <strong>کارت های فشرده</strong>
                                    <small>نمایش قطعه کدها با فاصله کمتر</small>
                                </span>
                                <input type="checkbox" id="compactCardsSetting">
                            </label>
                        </div>
                    </section>
        
                    <section class="glass settings-panel" style="margin-top: 1.5rem;">
                        <div class="settings-panel-header">
                            <div>
                                <h2>ویرایشگر</h2>
                                <p>رفتار پیش فرض ویرایشگر کد را مشخص کنید.</p>
                            </div>
                        </div>
                        <div class="settings-grid">
                            <label class="setting-field">
                                <span>اندازه تب</span>
                                <select id="tabSizeSetting">
                                    <option value="2">۲ فاصله</option>
                                    <option value="4">۴ فاصله</option>
                                </select>
                            </label>
                            <label class="setting-field">
                                <span>نمایش پیش فرض</span>
                                <select id="defaultVisibilitySetting">
                                    <option value="private">خصوصی</option>
                                    <option value="public">عمومی</option>
                                </select>
                            </label>
                        </div>
                        <div class="settings-list">
                            <label class="setting-row">
                                <span>
                                    <strong>شکستن خودکار خط ها</strong>
                                    <small>خط های بلند داخل ویرایشگر چند خطی شوند</small>
                                </span>
                                <input type="checkbox" id="lineWrapSetting">
                            </label>
                            <label class="setting-row">
                                <span>
                                    <strong>نمایش وضعیت ذخیره خودکار</strong>
                                    <small>متن ذخیره خودکار در بخش تاریخچه نمایش داده شود</small>
                                </span>
                                <input type="checkbox" id="autosaveLabelSetting">
                            </label>
                        </div>
                    </section>
                </div>

                <!-- Tab 2: Account -->
                <div id="tab-account" class="tab-content">
                    <section class="glass settings-panel">
                        <div class="settings-panel-header">
                            <div>
                                <h2>حساب کاربری</h2>
                                <p>راه های سریع برای مدیریت حساب شما.</p>
                            </div>
                        </div>
                        <div class="settings-actions">
                            <a href="profile.html" class="btn btn-secondary">
                                <i class="fas fa-user"></i> ویرایش پروفایل
                            </a>
                            <button id="resetPreferencesBtn" class="btn btn-secondary" type="button">
                                <i class="fas fa-undo"></i> بازنشانی تنظیمات
                            </button>
                            <button id="logoutSettingsBtn" class="btn btn-secondary" type="button">
                                <i class="fas fa-sign-out-alt"></i> خروج از حساب
                            </button>
                        </div>
                    </section>
                </div>
            </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="js/app.js"></script>
    <script src="js/settings.js"></script>
</body>
</html>
