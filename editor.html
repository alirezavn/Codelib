<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کدلیب | ویرایشگر</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
</head>
<body>
    <div class="container">
        <header class="nav-bar">
            <div style="display: flex; align-items: center; gap: 1.5rem;">
                <a href="dashboard.html" style="color: var(--text-dim); text-decoration: none; font-size: 1.2rem;">
                    <i class="fas fa-arrow-right"></i>
                </a>
                <h1 style="margin-bottom: 0; font-size: 1.8rem;" id="editorHeader">قطعه کد جدید</h1>
            </div>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <button class="btn btn-secondary" id="shareBtn">
                    <i class="fas fa-share-alt"></i> اشتراک گذاری
                </button>
                <button class="btn btn-secondary" id="deleteBtn" style="display: none; color: var(--danger);">
                    <i class="fas fa-trash"></i> حذف
                </button>
                <button class="btn btn-primary" id="saveBtn">
                    <i class="fas fa-save"></i> ذخیره تغییرات
                </button>
                <button id="themeToggle" class="btn btn-secondary btn-sm" title="تغییر تم" style="padding: 0.5rem;">
                    <i class="fas fa-moon"></i>
                </button>
                <button id="logoutBtn" class="btn btn-secondary btn-sm" title="خروج" style="padding: 0.5rem;">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </header>

        <main class="editor-container">
            <div class="code-area">
                <div class="input-group" style="margin-bottom: 0;">
                    <input type="text" id="snippetTitle" placeholder="عنوان قطعه کد" style="font-size: 1.5rem; background: transparent; border: none; border-bottom: 1px solid var(--glass-border); border-radius: 0; padding-left: 0;">
                </div>
                <div style="display: flex; gap: 1rem;">
                    <select id="snippetLanguage" style="background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 0.5rem 1rem; border-radius: 8px; color: var(--text-main); font-size: 0.9rem;">
                        <option value="php">PHP</option>
                        <option value="html">HTML</option>
                        <option value="css">CSS</option>
                        <option value="javascript">JavaScript</option>
                        <option value="text">متن ساده</option>
                    </select>
                    <input type="text" id="snippetTags" placeholder="برچسب ها را با کاما جدا کنید" style="background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 0.5rem 1rem; border-radius: 8px; color: var(--text-main); font-size: 0.9rem; flex-grow: 1;">
                </div>
                <textarea id="codeEditor" class="code-input" dir="ltr" placeholder="// کد خود را اینجا بنویسید..." spellcheck="false"></textarea>
            </div>

            <aside class="sidebar">
                <div class="glass" style="padding: 1.5rem;">
                    <h3 style="margin-bottom: 1rem; font-size: 1.1rem;">تنظیمات انتشار</h3>
                    <div class="input-group">
                        <label>حالت نمایش</label>
                        <select id="snippetVisibility" style="padding: 0.8rem;">
                            <option value="private">خصوصی</option>
                            <option value="public">عمومی</option>
                        </select>
                    </div>
                </div>

                <div class="glass" style="padding: 1.5rem;">
                    <h3 style="margin-bottom: 1rem; font-size: 1.1rem;">اطلاعات کد</h3>
                    <div class="input-group">
                        <label>توضیحات</label>
                        <textarea id="snippetDesc" style="height: 100px; padding: 0.8rem; resize: none;"></textarea>
                    </div>
                </div>

                <div class="glass" style="padding: 1.5rem; flex-grow: 1;">
                    <h3 style="margin-bottom: 1rem; font-size: 1.1rem; display: flex; justify-content: space-between; align-items: center;">
                        تاریخچه
                        <span id="autosaveLabel" style="font-size: 0.7rem; color: var(--text-dim); font-weight: 400;">ذخیره خودکار</span>
                    </h3>
                    <ul class="history-list" id="historyList"></ul>
                </div>
            </aside>
        </main>
    </div>

    <div id="toast" class="toast"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/php/php.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/snippets.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const autosaveLabel = document.getElementById('autosaveLabel');
            if (autosaveLabel && localStorage.getItem('autosaveLabel') === 'false') {
                autosaveLabel.style.display = 'none';
            }
            const visibility = document.getElementById('snippetVisibility');
            if (visibility && !new URLSearchParams(window.location.search).get('id')) {
                visibility.value = localStorage.getItem('defaultVisibility') || 'private';
            }
            const urlParams = new URLSearchParams(window.location.search);
            const snippetId = urlParams.get('id');
            if (snippetId) {
                loadSnippetForEditing(snippetId);
                document.getElementById('deleteBtn').style.display = 'inline-flex';
            }
        });
    </script>
</body>
</html>
