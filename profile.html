<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کدلیب | پروفایل</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="nav-bar">
            <div style="display: flex; align-items: center; gap: 1.5rem;">
                <a href="dashboard.html" style="color: var(--text-dim); text-decoration: none; font-size: 1.2rem;">
                    <i class="fas fa-arrow-right"></i>
                </a>
                <h1 style="margin-bottom: 0; font-size: 1.8rem;">پروفایل</h1>
            </div>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <button id="themeToggle" class="btn btn-secondary btn-sm" title="تغییر تم" style="padding: 0.5rem;">
                    <i class="fas fa-moon"></i>
                </button>
                <button id="logoutBtn" class="btn btn-secondary btn-sm" title="خروج" style="padding: 0.5rem;">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </header>

        <main class="profile-layout">
            <section class="glass profile-preview">
                <div id="profileAvatarPreview" class="profile-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <h2 id="profileNamePreview">...</h2>
                <p id="profileUsernamePreview" class="profile-handle"></p>
                <p id="profileBioPreview" class="profile-bio"></p>
            </section>

            <section class="glass profile-form-card">
                <form id="profileForm">
                    <div class="input-group">
                        <label for="displayName">نام نمایشی</label>
                        <input type="text" id="displayName" maxlength="100">
                    </div>
                    <div class="input-group">
                        <label for="avatarUrl">لینک تصویر پروفایل</label>
                        <input type="url" id="avatarUrl" placeholder="https://...">
                    </div>
                    <div class="input-group">
                        <label for="bio">درباره من</label>
                        <textarea id="bio" rows="5" style="padding: 0.8rem; resize: vertical;"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> ذخیره پروفایل
                    </button>
                </form>
            </section>
        </main>
    </div>

    <div id="toast" class="toast"></div>

    <script src="js/app.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
